version: 2

updates:
  # CLI runtime + dev dependencies. Only two runtime deps (commander,
  # @inquirer/prompts), so weekly batching keeps the PR volume near zero.
  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      dev-dependencies:
        dependency-type: development

  # Keeps the SHA-pinned actions in .github/workflows/ current. Dependabot
  # rewrites both the pin and the trailing `# vX` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
