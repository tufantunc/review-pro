name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI deps
        working-directory: cli
        run: npm ci

      - name: Build
        working-directory: cli
        run: npm run build

      - name: CLI tests
        working-directory: cli
        run: npm test

      - name: Validator (plugin + pack integrity)
        run: |
          ./scripts/validate.sh
          bash scripts/validate.test.sh

      - name: Site i18n build (tests + sync)
        run: |
          node --test scripts/build-site.test.js
          node scripts/build-site.js
          git diff --exit-code docs

      # The same scan the release gate runs, non-blocking here because a PR is not a
      # publish: its job is to prove on every PR that the gate's tooling works and to
      # surface findings early, not to force dependency work into unrelated PRs. The
      # blocking copy lives in publish.yml.
      - name: Supply-chain scan (report only)
        working-directory: cli
        run: npm sbom --sbom-format cyclonedx --package-lock-only --omit=dev > sbom-ci.cdx.json

      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: cli/sbom-ci.cdx.json
          fail-build: false
          severity-cutoff: critical
          only-fixed: true
